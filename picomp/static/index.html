<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PiComp</title>
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f5f7;
    --panel: #ffffff;
    --text: #1b2130;
    --muted: #5d6676;
    --line: #dce0e7;
    --accent: #2459c4;
    --accent-text: #ffffff;
    --ok: #1d8746;
    --warn: #b35a00;
    --bad: #c42b2b;
    --rec: #d02447;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121419;
      --panel: #1b1f26;
      --text: #e5e8ed;
      --muted: #98a1b0;
      --line: #2d323c;
      --accent: #6c9cf2;
      --accent-text: #0e1218;
      --ok: #4fc47c;
      --warn: #f0a24f;
      --bad: #f26b6b;
      --rec: #ff5f7e;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
  }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  h2 {
    font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 12px;
  }
  section {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 16px; margin-bottom: 16px;
  }
  .line { display: flex; align-items: baseline; gap: 10px; margin: 2px 0; }
  .dot {
    flex: none; width: 10px; height: 10px; border-radius: 50%;
    background: var(--muted); transform: translateY(-1px);
  }
  #board-line[data-s="connected"] .dot { background: var(--ok); }
  #board-line[data-s="halted"] .dot,
  #board-line[data-s="error"] .dot { background: var(--bad); }
  #state-line[data-s="idle"] .dot { background: var(--ok); }
  #state-line[data-s="recording"] .dot { background: var(--rec); animation: pulse 1s ease-in-out infinite; }
  #state-line[data-s="replaying"] .dot { background: var(--accent); }
  #state-line[data-s="paused"] .dot { background: var(--warn); }
  @keyframes pulse { 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { #state-line .dot { animation: none !important; } }
  #state { font-weight: 600; }
  #message { color: var(--muted); margin-top: 8px; min-height: 1.45em; overflow-wrap: anywhere; }
  #notice { color: var(--bad); margin-top: 4px; overflow-wrap: anywhere; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 12px; }
  .hint { color: var(--muted); font-size: 13px; }
  button, select, input[type="text"] {
    font: inherit; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px;
  }
  button { padding: 4px 12px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled, select:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button.danger:hover:not(:disabled) { border-color: var(--bad); color: var(--bad); }
  select { padding: 4px 8px; }
  label { display: inline-flex; align-items: center; gap: 10px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  th { font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.name { min-width: 180px; overflow-wrap: anywhere; }
  td.name input { width: 100%; padding: 3px 6px; }
  td.created { white-space: nowrap; }
  td.actions { text-align: right; white-space: nowrap; }
  td.actions button + button { margin-left: 6px; }
  td.empty { color: var(--muted); text-align: center; padding: 24px 8px; }
</style>
</head>
<body>
<main>
  <h1>PiComp</h1>

  <section aria-live="polite">
    <div class="line" id="board-line"><span class="dot"></span><span id="board">Connecting to the server...</span></div>
    <div class="line" id="state-line"><span class="dot"></span><span id="state"></span></div>
    <div id="message"></div>
    <div id="notice" hidden></div>
    <div class="controls" id="controls" hidden><button type="button" id="resume" class="primary" hidden>Resume</button><span id="resume-hint" class="hint" hidden>click Resume, then let go of the mouse</span><button type="button" id="stop" hidden>Stop replay</button></div>
  </section>

  <section>
    <h2>Settings</h2>
    <label>Screenshots while recording
      <select id="shots" disabled>
        <option value="each_click">each click</option>
        <option value="start_end">start + end</option>
        <option value="none">none</option>
      </select>
    </label>
  </section>

  <section>
    <h2>Recordings</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Created</th>
            <th class="num">Duration</th>
            <th class="num">Steps</th>
            <th class="num">Shots</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="recs"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
"use strict";

const $ = (id) => document.getElementById(id);
const JSON_HEADERS = {"Content-Type": "application/json"};
const NOT_AUTHORIZED = "Not authorized: open the URL printed in the server console";
const POLL_MS = 500;

let current = null;         // last /api/status reply, null while the server is unreachable
let lastState = null;
let shotsValue = null;      // the setting as the server last confirmed it
let listLoaded = false;
let listSeq = 0;            // drops replies of older /api/recordings requests
let listPending = 0;
let noticeFromPoll = false; // a notice made by polling clears itself once polling works again

function setNotice(text, fromPoll) {
  $("notice").textContent = text;
  $("notice").hidden = !text;
  noticeFromPoll = Boolean(text) && Boolean(fromPoll);
}

function detailText(data, code) {
  const d = data && data.detail;
  if (typeof d === "string") return d;
  if (d) return JSON.stringify(d);
  return "request failed (HTTP " + code + ")";
}

// Resolves to {data} on success, or to null after showing the error in #notice.
async function api(path, opts, fromPoll) {
  let res;
  try {
    res = await fetch(path, Object.assign({cache: "no-store"}, opts));
  } catch (e) {
    setNotice("server not reachable", fromPoll);
    return null;
  }
  if (res.status === 401) {
    setNotice(NOT_AUTHORIZED, fromPoll);
    return null;
  }
  let data = null;
  if (res.status !== 204) {
    try { data = await res.json(); } catch (e) { data = null; }
  }
  if (!res.ok) {
    setNotice(detailText(data, res.status), fromPoll);
    return null;
  }
  if (fromPoll && noticeFromPoll) setNotice("", false);
  return {data: data};
}

// --- status ---

function boardText(s) {
  switch (s.board) {
    case "connected": return "Board connected (" + s.board_detail + ")";
    case "halted": return "Board halted (BOOT): next Replay re-arms";
    case "error": return "Board error: " + s.board_detail;
    default: return "Board offline";
  }
}

function stateText(s) {
  switch (s.state) {
    case "idle": return "Idle: press Ctrl+Alt+R to record";
    case "recording":
      return "Recording... press Ctrl+Alt+R to stop (" + (s.recording ? s.recording.steps : 0) + " steps)";
    case "saving": return "Saving recording...";
    case "replaying": {
      const r = s.replay || {step: 0, total: 0};
      return "Replaying step " + r.step + " of " + r.total +
        ": hands off the mouse and keyboard (Ctrl+Alt+Esc stops)";
    }
    case "paused": return "Paused: " + s.message;
    default: return s.state;
  }
}

function render(s) {
  current = s;
  $("board").textContent = boardText(s);
  $("board-line").dataset.s = s.board;
  $("state").textContent = stateText(s);
  $("state-line").dataset.s = s.state;
  // While paused the reason is already on the state line.
  $("message").textContent = s.state === "paused" ? "" : s.message;
  const paused = s.state === "paused";
  const active = paused || s.state === "replaying";
  $("controls").hidden = !active;
  $("resume").hidden = !paused;
  $("resume-hint").hidden = !paused;
  $("stop").hidden = !active;
  document.title = s.state === "idle" ? "PiComp" : "PiComp: " + s.state;
  applyLock();
  if (lastState !== null && lastState !== "idle" && s.state === "idle") loadRecordings();
  lastState = s.state;
}

// No status: the notice says why. Nothing from the last reply may look current.
function renderUnknown() {
  current = null;
  $("board").textContent = "Board status unknown";
  $("board-line").dataset.s = "";
  $("state").textContent = "";
  $("state-line").dataset.s = "";
  $("message").textContent = "";
  $("controls").hidden = true;
  document.title = "PiComp";
  applyLock();
}

async function poll() {
  try {
    const r = await api("/api/status", undefined, true);
    if (r) {
      render(r.data);
      if (!listLoaded && !listPending) loadRecordings();
      if (shotsValue === null) loadSettings();
    } else {
      renderUnknown();
    }
  } finally {
    setTimeout(poll, POLL_MS);
  }
}

// Nothing may change while recording or replaying: the server answers 409 anyway,
// and a replayed click on this page must not edit data.
function applyLock() {
  const idle = current !== null && current.state === "idle";
  const boardOk = current !== null && (current.board === "connected" || current.board === "halted");
  $("shots").disabled = !idle || shotsValue === null;
  for (const el of document.querySelectorAll("#recs button, #recs input")) {
    el.disabled = !idle || el.dataset.busy === "1" || (el.classList.contains("replay") && !boardOk);
  }
}

// --- settings ---

let settingsLoading = false;

async function loadSettings() {
  if (settingsLoading) return;
  settingsLoading = true;
  try {
    const r = await api("/api/settings");
    if (r) {
      shotsValue = r.data.screenshots;
      $("shots").value = shotsValue;
      applyLock();
    }
  } finally {
    settingsLoading = false;
  }
}

$("shots").addEventListener("change", async () => {
  const sel = $("shots");
  setNotice("");
  const r = await api("/api/settings", {
    method: "PUT",
    headers: JSON_HEADERS,
    body: JSON.stringify({screenshots: sel.value}),
  });
  if (r) shotsValue = r.data.screenshots;
  sel.value = shotsValue;
});

// --- recordings ---

async function loadRecordings() {
  const seq = ++listSeq;
  listPending++;
  try {
    const r = await api("/api/recordings");
    if (!r || seq !== listSeq) return;
    listLoaded = true;
    renderRecordings(r.data);
  } finally {
    listPending--;
  }
}

function addCell(tr, text, cls) {
  const td = document.createElement("td");
  td.textContent = text;
  if (cls) td.className = cls;
  tr.appendChild(td);
  return td;
}

function addButton(parent, text, cls, onClick) {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = text;
  if (cls) b.className = cls;
  b.addEventListener("click", onClick);
  parent.appendChild(b);
  return b;
}

function renderRecordings(list) {
  const body = $("recs");
  body.textContent = "";
  if (!list.length) {
    const tr = document.createElement("tr");
    addCell(tr, "No recordings yet: press Ctrl+Alt+R to start one.", "empty").colSpan = 6;
    body.appendChild(tr);
    return;
  }
  for (const rec of list) {
    const tr = document.createElement("tr");
    tr.title = rec.screen_w + "x" + rec.screen_h + " at " + rec.dpi + " dpi, screenshots: " + rec.shots_mode;
    const nameCell = addCell(tr, rec.name, "name");
    addCell(tr, new Date(rec.created_at).toLocaleString(), "created");
    addCell(tr, (rec.duration_ms / 1000).toFixed(1) + " s", "num");
    addCell(tr, String(rec.steps), "num");
    addCell(tr, String(rec.shots), "num");
    const actions = addCell(tr, "", "actions");
    addButton(actions, "Rename", "", () => startRename(nameCell, rec));
    addButton(actions, "Delete", "danger", () => deleteRecording(rec));
    addButton(actions, "Replay", "replay primary", () => replay(rec));
    body.appendChild(tr);
  }
  applyLock();
}

function startRename(td, rec) {
  if (td.querySelector("input")) return;
  const input = document.createElement("input");
  input.type = "text";
  input.maxLength = 100;
  input.value = rec.name;
  input.setAttribute("aria-label", "New name");
  td.textContent = "";
  td.appendChild(input);
  const close = () => { td.textContent = rec.name; };
  input.addEventListener("keydown", async (e) => {
    if (e.key === "Escape") {
      e.preventDefault();
      close();
      return;
    }
    if (e.key !== "Enter") return;
    e.preventDefault();
    const name = input.value.trim();
    if (name === rec.name) {
      close();
      return;
    }
    setNotice("");
    input.dataset.busy = "1";
    input.disabled = true;
    const r = await api("/api/recordings/" + rec.id, {
      method: "PATCH",
      headers: JSON_HEADERS,
      body: JSON.stringify({name}),
    });
    if (r) {
      rec.name = r.data.name;
      close();
      loadRecordings();
      return;
    }
    delete input.dataset.busy;
    applyLock();
    input.focus();
  });
  applyLock();
  input.focus();
  input.select();
}

async function deleteRecording(rec) {
  if (!confirm('Delete "' + rec.name + '"? This cannot be undone.')) return;
  setNotice("");
  await api("/api/recordings/" + rec.id, {method: "DELETE"});
  loadRecordings();
}

async function replay(rec) {
  setNotice("");
  await api("/api/recordings/" + rec.id + "/replay", {method: "POST"});
}

// --- replay controls ---

$("resume").addEventListener("click", async () => {
  setNotice("");
  await api("/api/replay/resume", {method: "POST"});
});

$("stop").addEventListener("click", async () => {
  setNotice("");
  await api("/api/replay/stop", {method: "POST"});
});

loadSettings();
loadRecordings();
poll();
</script>
</body>
</html>
